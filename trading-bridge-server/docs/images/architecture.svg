<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>거래브리지 서버 아키텍처</title>
  <desc>AWS VPC 내부에 운영서버, 거래브리지 서버, MySQL이 위치하고, 거래브리지 서버가 외부의 KIS Open API 및 reports/logs 파일 저장소와 연결되는 구조도</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5B5B5B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#FFFFFF"/>

  <!-- VPC container -->
  <rect x="50" y="40" width="800" height="280" rx="20" fill="#EAF3FF" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="80" y="72" font-size="20" font-weight="600" fill="#0C447C">AWS VPC</text>
  <text x="80" y="94" font-size="14" fill="#0C447C">지정 서버만 접근 허용 (Security Group + IP 허용목록)</text>

  <!-- 운영서버 -->
  <rect x="90" y="130" width="220" height="130" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="200" y="168" text-anchor="middle" font-size="19" font-weight="600" fill="#085041">운영서버</text>
  <text x="200" y="196" text-anchor="middle" font-size="13" fill="#085041">전략 실행</text>
  <text x="200" y="216" text-anchor="middle" font-size="13" fill="#085041">HMAC 서명 생성</text>

  <!-- 거래브리지 서버 -->
  <rect x="340" y="130" width="220" height="130" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
  <text x="450" y="168" text-anchor="middle" font-size="19" font-weight="600" fill="#3C3489">거래브리지 서버</text>
  <text x="450" y="196" text-anchor="middle" font-size="13" fill="#3C3489">FastAPI + APScheduler</text>
  <text x="450" y="216" text-anchor="middle" font-size="13" fill="#3C3489">인증 · 주문중계 · 리포트</text>

  <!-- MySQL -->
  <rect x="590" y="130" width="220" height="130" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
  <text x="700" y="168" text-anchor="middle" font-size="19" font-weight="600" fill="#085041">MySQL</text>
  <text x="700" y="196" text-anchor="middle" font-size="13" fill="#085041">계좌 · 세션 · 거래기록</text>
  <text x="700" y="216" text-anchor="middle" font-size="13" fill="#085041">nonce 저장</text>

  <!-- internal arrows -->
  <line x1="310" y1="195" x2="340" y2="195" stroke="#5B5B5B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="325" y="182" text-anchor="middle" font-size="11" fill="#5B5B5B">REST</text>

  <line x1="560" y1="195" x2="590" y2="195" stroke="#5B5B5B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- arrows down to external boxes -->
  <line x1="450" y1="260" x2="290" y2="380" stroke="#5B5B5B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="260" x2="660" y2="380" stroke="#5B5B5B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- KIS Open API -->
  <rect x="150" y="380" width="280" height="100" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
  <text x="290" y="418" text-anchor="middle" font-size="19" font-weight="600" fill="#712B13">KIS Open API</text>
  <text x="290" y="446" text-anchor="middle" font-size="13" fill="#712B13">해외주식 주문 · 잔고 · 체결조회</text>
  <text x="290" y="464" text-anchor="middle" font-size="12" fill="#993C1D">(외부, HTTPS)</text>

  <!-- reports/logs -->
  <rect x="520" y="380" width="280" height="100" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="660" y="418" text-anchor="middle" font-size="19" font-weight="600" fill="#444441">reports/ · logs/</text>
  <text x="660" y="446" text-anchor="middle" font-size="13" fill="#444441">리포트 파일 · 로그 파일</text>
  <text x="660" y="464" text-anchor="middle" font-size="12" fill="#5F5E5A">(로컬 파일시스템)</text>

  <text x="450" y="530" text-anchor="middle" font-size="12" fill="#888780">거래브리지 서버 아키텍처 — 2026-08-14</text>
</svg>
