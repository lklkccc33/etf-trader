<svg width="960" height="800" viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>주문 처리 시퀀스 다이어그램</title>
  <desc>운영서버가 주문을 보내면 거래브리지 서버가 서명 검증, 중복 확인, KIS 주문 접수, 체결 확인 폴링, 잔고 갱신을 거쳐 응답하는 흐름</desc>

  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3C3489" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="800" fill="#FFFFFF"/>

  <!-- lifeline headers -->
  <g>
    <rect x="40" y="20" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
    <text x="120" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">운영서버</text>
  </g>
  <g>
    <rect x="300" y="20" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
    <text x="400" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">거래브리지 서버</text>
  </g>
  <g>
    <rect x="580" y="20" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
    <text x="650" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">MySQL</text>
  </g>
  <g>
    <rect x="770" y="20" width="180" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
    <text x="860" y="47" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">KIS Open API</text>
  </g>

  <!-- lifelines -->
  <line x1="120" y1="64" x2="120" y2="740" stroke="#C9C7BE" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="400" y1="64" x2="400" y2="740" stroke="#C9C7BE" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="650" y1="64" x2="650" y2="740" stroke="#C9C7BE" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="860" y1="64" x2="860" y2="740" stroke="#C9C7BE" stroke-width="1.2" stroke-dasharray="3,4"/>

  <!-- 1 -->
  <text x="260" y="102" text-anchor="middle" font-size="12" fill="#333">POST /api/v1/orders (서명 헤더 포함)</text>
  <line x1="120" y1="110" x2="400" y2="110" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>

  <!-- 2 -->
  <text x="525" y="152" text-anchor="middle" font-size="12" fill="#333">nonce 예약 + client_order_id 중복확인</text>
  <line x1="400" y1="160" x2="650" y2="160" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>

  <!-- 3 -->
  <text x="525" y="192" text-anchor="middle" font-size="12" fill="#666">중복 아님</text>
  <line x1="650" y1="200" x2="400" y2="200" stroke="#888780" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>

  <!-- 4 -->
  <text x="630" y="242" text-anchor="middle" font-size="12" fill="#333">주문 접수 요청 (hashkey 포함)</text>
  <line x1="400" y1="250" x2="860" y2="250" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>

  <!-- 5 -->
  <text x="630" y="282" text-anchor="middle" font-size="12" fill="#666">접수 응답 (주문번호)</text>
  <line x1="860" y1="290" x2="400" y2="290" stroke="#888780" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>

  <!-- 6 -->
  <text x="525" y="322" text-anchor="middle" font-size="12" fill="#333">trade_records 저장 (fill_status=PENDING)</text>
  <line x1="400" y1="330" x2="650" y2="330" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>

  <!-- loop box -->
  <rect x="370" y="355" width="520" height="110" rx="8" fill="none" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="370" y="355" width="150" height="24" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="445" y="371" text-anchor="middle" font-size="11" fill="#633806">loop 최대 3회, 1초 간격</text>

  <text x="630" y="402" text-anchor="middle" font-size="12" fill="#333">체결 여부 조회</text>
  <line x1="400" y1="410" x2="860" y2="410" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>
  <text x="630" y="442" text-anchor="middle" font-size="12" fill="#666">체결 결과 (수량/가격)</text>
  <line x1="860" y1="450" x2="400" y2="450" stroke="#888780" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>

  <!-- 7 -->
  <text x="630" y="502" text-anchor="middle" font-size="12" fill="#333">잔고 재조회</text>
  <line x1="400" y1="510" x2="860" y2="510" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>

  <!-- 8 -->
  <text x="630" y="542" text-anchor="middle" font-size="12" fill="#666">잔고 응답</text>
  <line x1="860" y1="550" x2="400" y2="550" stroke="#888780" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>

  <!-- 9 -->
  <text x="525" y="582" text-anchor="middle" font-size="12" fill="#333">balance / fill_status 갱신</text>
  <line x1="400" y1="590" x2="650" y2="590" stroke="#3C3489" stroke-width="1.6" marker-end="url(#arrowS)"/>

  <!-- 10 -->
  <text x="260" y="632" text-anchor="middle" font-size="12" fill="#666">최종 응답 (status, fill_status, balance ...)</text>
  <line x1="400" y1="640" x2="120" y2="640" stroke="#888780" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>

  <!-- background note -->
  <rect x="370" y="680" width="520" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="630" y="705" text-anchor="middle" font-size="12" fill="#444441">백그라운드 (3분마다): fill_status=PENDING 주문을</text>
  <text x="630" y="723" text-anchor="middle" font-size="12" fill="#444441">스케줄러가 다시 KIS에 조회해 갱신</text>

  <text x="480" y="780" text-anchor="middle" font-size="12" fill="#888780">주문 처리 시퀀스 — 2026-08-14</text>
</svg>
